<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Input</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      font-family: sans-serif;
      background-image: url('bg.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .wrapper {
      width: 100%;
      max-width: 640px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <form id="chat-form" class="relative flex-1 w-full">
      <div data-slot="input-group" role="group" class="group/input-group relative flex w-full items-center rounded-[1.25rem] border border-neutral-200 bg-white shadow-sm outline-none transition-[color,box-shadow] min-w-0 overflow-hidden flex-col">
        <div class="relative block w-full">
          <textarea
            id="chat-input-empty"
            class="flex w-full border-neutral-200 px-3 placeholder:text-neutral-500 focus-visible:outline-none disabled:cursor-not-allowed disabled:opacity-50 flex-1 resize-none rounded-none border-0 bg-transparent py-3 shadow-none focus-visible:ring-0 max-h-48 min-h-0 text-base leading-6"
            rows="1"
            name="message"
            placeholder="What's your role and what eats up most of your day?"
            aria-label="Chat message input"
            style="height: 48px;"
          ></textarea>
        </div>
        <span id="chat-input-empty-hint" class="sr-only">Press Enter to send, Shift+Enter for new line, Space to record voice</span>
        <div role="group" data-slot="input-group-addon" class="flex h-auto cursor-text items-center py-1.5 text-sm font-medium select-none order-last w-full px-3 pb-3 justify-between gap-1">
          <!-- Left: Attach button -->
          <div class="flex min-w-0 items-center gap-1">
            <input multiple class="hidden" tabindex="-1" type="file">
            <button
              class="inline-flex items-center justify-center whitespace-nowrap font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-neutral-950 disabled:pointer-events-none p-3 border rounded-[96px] border-zinc-300 bg-white text-zinc-500 hover:border-zinc-400 hover:bg-zinc-50 hover:text-zinc-700"
              type="button"
              aria-label="Attach file"
              disabled
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 256 256" class="h-4 w-4">
                <path d="M228,128a12,12,0,0,1-12,12H140v76a12,12,0,0,1-24,0V140H40a12,12,0,0,1,0-24h76V40a12,12,0,0,1,24,0v76h76A12,12,0,0,1,228,128Z"></path>
              </svg>
            </button>
          </div>

          <!-- Right: Mic + Submit buttons -->
          <div class="flex items-center gap-4">
            <!-- Mic button -->
            <button
              class="inline-flex items-center justify-center whitespace-nowrap font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-neutral-950 disabled:pointer-events-none p-3 rounded-[96px] border-0 bg-white text-zinc-500 hover:bg-zinc-50 hover:text-zinc-700"
              type="button"
              aria-label="Start recording"
              disabled
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 256 256" class="h-4 w-4">
                <path d="M128,180a52.06,52.06,0,0,0,52-52V64A52,52,0,0,0,76,64v64A52.06,52.06,0,0,0,128,180ZM100,64a28,28,0,0,1,56,0v64a28,28,0,0,1-56,0Zm40,155.22V240a12,12,0,0,1-24,0V219.22A92.14,92.14,0,0,1,36,128a12,12,0,0,1,24,0,68,68,0,0,0,136,0,12,12,0,0,1,24,0A92.14,92.14,0,0,1,140,219.22Z"></path>
              </svg>
            </button>

            <!-- Submit button -->
            <button
              id="submit-btn"
              class="inline-flex justify-center whitespace-nowrap font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-neutral-950 disabled:pointer-events-none text-sm shadow-none items-center p-0 size-[2.625rem] rounded-full bg-zinc-800 text-white hover:bg-zinc-900 disabled:bg-zinc-200 disabled:text-white disabled:opacity-100"
              type="submit"
              aria-label="Submit"
              disabled
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 256 256" class="size-4">
                <path d="M208.49,120.49a12,12,0,0,1-17,0L140,69V216a12,12,0,0,1-24,0V69L64.49,120.49a12,12,0,0,1-17-17l72-72a12,12,0,0,1,17,0l72,72A12,12,0,0,1,208.49,120.49Z"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </form>
  </div>

  <script>
    const textarea = document.getElementById('chat-input-empty');
    const submitBtn = document.getElementById('submit-btn');
    const form = document.getElementById('chat-form');

    textarea.addEventListener('input', () => {
      submitBtn.disabled = textarea.value.trim() === '';
    });

    textarea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!submitBtn.disabled) form.requestSubmit();
      }
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const prompt = textarea.value.trim();
      if (!prompt) return;
      const url = `https://platform.agpt.co/login?next=%2Fcopilot%3Fautosubmit%3Dtrue#prompt=${encodeURIComponent(prompt)}`;
      window.location.href = url;
    });
  </script>
</body>
</html>
