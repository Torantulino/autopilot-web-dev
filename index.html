<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoGPT CoPilot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ── Hero ── */
    body { margin: 0; display: flex; flex-direction: column; min-height: 100vh; background: var(--bg); color: var(--ink); }
    .hero {
      position: relative; display: flex; align-items: center;
      justify-content: center; min-height: 100vh; width: 100%;
      background: url('bg.png') center center / cover no-repeat;
    }
    .hero::before {
      content: ''; position: absolute; inset: 0;
      background: rgba(0,0,0,0.25);
    }
    .wrapper {
      position: relative; z-index: 1;
      width: 100%; max-width: 640px; padding: 1rem;
    }

  :root {
    --bg: #0b0b0f;
    --bg-2: #0f1014;
    --ink: #f5f5f7;
    --muted: #8a8a92;
    --rule: rgba(255,255,255,0.08);
    --row-h: 64px;
    --row-h-sm: 52px;
    --gap: 84px;
    --gap-sm: 72px;
    --speed-1: 140s;
    --speed-2: 160s;
    --speed-3: 90s;
  }

  .press {
    width: 100%;
    max-width: 1440px;
    margin: 0 auto;
    padding: 56px 0 56px;
    border-top: 1px solid var(--rule);
    position: relative;
  }
  .press + .press { margin-top: 0; padding-top: 64px; }
  .press:last-of-type { border-bottom: 1px solid var(--rule); padding-bottom: 64px; }

  .press__eyebrow {
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 36px;
  }
  .press__eyebrow::before,
  .press__eyebrow::after {
    content: "";
    display: inline-block;
    width: 28px;
    height: 1px;
    background: var(--rule);
    vertical-align: middle;
    margin: 0 14px;
    transform: translateY(-2px);
  }

  .marquee {
    position: relative;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(
      to right,
      transparent 0,
      #000 80px,
      #000 calc(100% - 80px),
      transparent 100%
    );
            mask-image: linear-gradient(
      to right,
      transparent 0,
      #000 80px,
      #000 calc(100% - 80px),
      transparent 100%
    );
  }
  .marquee + .marquee { margin-top: 28px; }

  .marquee__track {
    display: flex;
    width: max-content;
    align-items: center;
    gap: var(--gap);
    padding: 8px 0;
    margin: 0;
    list-style: none;
    animation: scroll var(--speed-1) linear infinite;
    will-change: transform;
  }

  .marquee--row2 .marquee__track {
    animation-duration: var(--speed-2);
    animation-direction: reverse;
  }
  .marquee--cited .marquee__track {
    animation-duration: var(--speed-3);
    gap: var(--gap-sm);
  }

  .marquee:hover .marquee__track { animation-play-state: paused; }

  @keyframes scroll {
    from { transform: translate3d(0, 0, 0); }
    to   { transform: translate3d(-50%, 0, 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .marquee__track { animation: none; }
    .marquee { overflow-x: auto; }
  }

  .logo {
    flex: 0 0 auto;
    height: var(--row-h);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    opacity: 0.78;
    transition: opacity 220ms ease, filter 220ms ease, transform 220ms ease;
    user-select: none;
  }
  .logo:hover { opacity: 1; transform: translateY(-1px); }
  .logo img {
    display: block;
    height: 100%;
    width: auto;
    max-width: 240px;
    object-fit: contain;
    filter: brightness(0) invert(1) contrast(1.05);
  }
  .logo--tall  img { height: 110%; }
  .logo--short img { height: 78%; }

  .marquee--cited .logo { height: var(--row-h-sm); opacity: 0.70; }
  .marquee--cited .logo img { max-width: 200px; }

  .logo .fallback {
    display: none;
    white-space: nowrap;
    color: #fff;
    line-height: 1;
  }
  .logo img.is-failed { display: none; }
  .logo img.is-failed + .fallback { display: inline-flex; align-items: center; }

  .fb-serif      { font-family: "Old Standard TT", "Times New Roman", Georgia, serif; }
  .fb-sans       { font-family: "Inter", "Helvetica Neue", Arial, sans-serif; font-weight: 700; letter-spacing: -0.01em; }
  .fb-sans-thin  { font-family: "Inter", "Helvetica Neue", Arial, sans-serif; font-weight: 500; letter-spacing: 0.02em; }
  .fb-mono       { font-family: "JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace; font-weight: 600; }
  .fb-cond       { font-family: "Oswald", "Inter", sans-serif; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
  .fb-allcaps    { text-transform: uppercase; letter-spacing: 0.14em; }
  .fb-italic     { font-style: italic; }
  .fb-xl  { font-size: 30px; }
  .fb-lg  { font-size: 26px; }
  .fb-md  { font-size: 22px; }
  .fb-sm  { font-size: 19px; }

  /* TIME-style red box wordmark recreation */
  .fb-time-box {
    display: inline-flex; align-items: center; justify-content: center;
    background: #e90000; padding: 6px 14px; line-height: 1;
    font-family: "Old Standard TT", "Times New Roman", Georgia, serif;
    font-weight: 700; font-size: 26px; color: #fff !important;
    letter-spacing: -0.01em;
  }

  /* GOV.UK style "crown" wordmark recreation (purely typographic) */
  .fb-govuk {
    display: inline-flex; align-items: center;
    background: #fff; color: #0b0c0c !important;
    padding: 6px 14px; font-family: "Inter", Arial, sans-serif;
    font-weight: 700; font-size: 22px; letter-spacing: 0.01em;
  }

  /* Senate / official-document style */
  .fb-official {
    display: inline-flex; flex-direction: column; align-items: center;
    line-height: 1.1; text-align: center;
  }
  .fb-official .top {
    font-family: "Old Standard TT", "Times New Roman", Georgia, serif;
    font-size: 20px; letter-spacing: 0.02em;
  }
  .fb-official .bot {
    font-family: "Inter", sans-serif; font-size: 10px;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: #cfcfd6; margin-top: 4px;
  }

  .press__footnote {
    margin-top: 36px;
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.08em;
  }

    /* ── White text fix ── */
    .press__eyebrow  { color: rgba(255,255,255,0.65); }
    .press__footnote { color: rgba(255,255,255,0.5);  }
  </style>
</head>
<body>
  <div class="hero">
    <div class="wrapper">
      <form id="chat-form" class="relative flex-1 w-full">
        <div data-slot="input-group" role="group" class="group/input-group relative flex w-full items-center rounded-[1.25rem] border border-neutral-200 bg-white shadow-sm outline-none transition-[color,box-shadow] min-w-0 overflow-hidden flex-col">
          <div class="relative block w-full">
            <textarea id="chat-input-empty"
              class="flex w-full border-neutral-200 px-3 placeholder:text-neutral-500 focus-visible:outline-none disabled:cursor-not-allowed disabled:opacity-50 flex-1 resize-none rounded-none border-0 bg-transparent py-3 shadow-none focus-visible:ring-0 max-h-48 min-h-0 text-base leading-6"
              rows="1" name="message"
              placeholder="What's your role and what eats up most of your day?"
              aria-label="Chat message input"
              style="height: 48px;"></textarea>
          </div>
          <span id="chat-input-empty-hint" class="sr-only">Press Enter to send, Shift+Enter for new line</span>
          <div role="group" data-slot="input-group-addon"
            class="flex h-auto cursor-text items-center py-1.5 text-sm font-medium select-none order-last w-full px-3 pb-3 justify-between gap-1">
            <!-- Attach button (disabled) -->
            <div class="flex items-center gap-1">
              <button type="button" disabled
                style="cursor:no-drop"
                class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium disabled:pointer-events-none disabled:opacity-50 hover:bg-neutral-100 hover:text-neutral-900 h-8 w-8 text-neutral-500"
                aria-label="Attach file">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/>
                </svg>
              </button>
              <!-- Mic button (disabled) -->
              <button type="button" disabled
                style="cursor:no-drop"
                class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium disabled:pointer-events-none disabled:opacity-50 hover:bg-neutral-100 hover:text-neutral-900 h-8 w-8 text-neutral-500"
                aria-label="Voice input">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/>
                </svg>
              </button>
            </div>
            <!-- Submit button -->
            <button id="submit-btn" type="submit" disabled
              class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-neutral-950 disabled:pointer-events-none disabled:opacity-50 bg-neutral-900 text-neutral-50 shadow hover:bg-neutral-800 h-8 px-4">
              Send
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script>
    /* ── Form JS ── */
    const textarea  = document.getElementById('chat-input-empty');
    const submitBtn = document.getElementById('submit-btn');
    const form      = document.getElementById('chat-form');

    textarea.addEventListener('input', () => {
      submitBtn.disabled = textarea.value.trim() === '';
    });
    textarea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!submitBtn.disabled) form.requestSubmit();
      }
    });
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const prompt = textarea.value.trim();
      if (!prompt) return;
      window.location.href =
        `https://platform.agpt.co/copilot?autosubmit=true#prompt=${encodeURIComponent(prompt)}`;
    });

  function logoMarkup(o) {
    const cls = o.size === "tall"  ? "logo logo--tall"
              : o.size === "short" ? "logo logo--short"
              : "logo";
    const src = "https://commons.wikimedia.org/wiki/Special:FilePath/"
              + encodeURIComponent(o.f) + "?width=480";
    return `<li class="${cls}" title="${o.n}">
              <img src="${src}" alt="${o.n}"
                   loading="lazy" decoding="async"
                   onerror="this.classList.add('is-failed')" />
              <span class="fallback">${o.fb}</span>
            </li>`;
  }

  function fillTrack(elId, items) {
    const html = items.map(logoMarkup).join("");
    document.getElementById(elId).innerHTML = html + html; // duplicate for seamless loop
  }

  fillTrack("row1", featuredRow1);
  fillTrack("row2", featuredRow2);
  fillTrack("row3", cited);
  </script>
</body>
</html>
