<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 0;
      font-family: sans-serif;
      background-image: url('bg.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .hero {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100vh;
      padding: 2rem;
    }
    .wrapper {
      width: 100%;
      max-width: 640px;
    }

  :root {
    --bg: #0b0b0f;
    --bg-2: #0f1014;
    --ink: #f5f5f7;
    --muted: #8a8a92;
    --rule: rgba(255,255,255,0.08);
    --row-h: 64px;
    --gap: 84px;
    --speed-1: 90s;
    --speed-2: 110s;
  }

  .press {
    width: 100%;
    max-width: 1440px;
    margin: 0 auto;
    padding: 56px 0 64px;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    position: relative;
  }

  .press__eyebrow {
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 36px;
  }

  .press__eyebrow::before,
  .press__eyebrow::after {
    content: "";
    display: inline-block;
    width: 28px;
    height: 1px;
    background: var(--rule);
    vertical-align: middle;
    margin: 0 14px;
    transform: translateY(-2px);
  }

  .marquee {
    position: relative;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(
      to right,
      transparent 0,
      #000 80px,
      #000 calc(100% - 80px),
      transparent 100%
    );
            mask-image: linear-gradient(
      to right,
      transparent 0,
      #000 80px,
      #000 calc(100% - 80px),
      transparent 100%
    );
  }

  .marquee + .marquee { margin-top: 28px; }

  .marquee__track {
    display: flex;
    width: max-content;
    align-items: center;
    gap: var(--gap);
    padding: 8px 0;
    animation: scroll var(--speed-1) linear infinite;
    will-change: transform;
  }

  .marquee--reverse .marquee__track {
    animation-duration: var(--speed-2);
    animation-direction: reverse;
  }

  .marquee:hover .marquee__track { animation-play-state: paused; }

  @keyframes scroll {
    from { transform: translate3d(0, 0, 0); }
    to   { transform: translate3d(-50%, 0, 0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .marquee__track { animation: none; }
    .marquee { overflow-x: auto; }
  }

  .logo {
    flex: 0 0 auto;
    height: var(--row-h);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    opacity: 0.78;
    transition: opacity 220ms ease, filter 220ms ease, transform 220ms ease;
    user-select: none;
  }

  .logo:hover { opacity: 1; transform: translateY(-1px); }

  .logo img {
    display: block;
    height: 100%;
    width: auto;
    max-width: 240px;
    object-fit: contain;
    filter: brightness(0) invert(1) contrast(1.05);
  }

  /* Slightly larger row for masthead-style serif marks */
  .logo--tall img { height: 110%; }
  .logo--short img { height: 78%; }

  /* Typographic fallback — shown if image fails to load.
     Each fallback is hand-tuned to feel like the publication's wordmark. */
  .logo .fallback {
    display: none;
    white-space: nowrap;
    color: #fff;
    line-height: 1;
  }
  .logo img.is-failed { display: none; }
  .logo img.is-failed + .fallback { display: inline-flex; align-items: center; }

  /* Fallback typographies */
  .fb-serif      { font-family: "Old Standard TT", "Times New Roman", Georgia, serif; }
  .fb-sans       { font-family: "Inter", "Helvetica Neue", Arial, sans-serif; font-weight: 700; letter-spacing: -0.01em; }
  .fb-sans-thin  { font-family: "Inter", "Helvetica Neue", Arial, sans-serif; font-weight: 500; letter-spacing: 0.02em; }
  .fb-mono       { font-family: "JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace; font-weight: 600; }
  .fb-cond       { font-family: "Oswald", "Inter", sans-serif; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
  .fb-allcaps    { text-transform: uppercase; letter-spacing: 0.14em; }
  .fb-italic     { font-style: italic; }

  .fb-xl  { font-size: 30px; }
  .fb-lg  { font-size: 26px; }
  .fb-md  { font-size: 22px; }
  .fb-sm  { font-size: 19px; }

  .press__footnote {
    margin-top: 32px;
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.08em;
  }
      .press__eyebrow  { color: rgba(255,255,255,0.65) !important; }
    .press__footnote { color: rgba(255,255,255,0.5)  !important; }
  </style>

  <script>
    const textarea = document.getElementById('chat-input-empty');
    const submitBtn = document.getElementById('submit-btn');
    const form = document.getElementById('chat-form');

    textarea.addEventListener('input', () => {
      submitBtn.disabled = textarea.value.trim() === '';
    });

    textarea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!submitBtn.disabled) form.requestSubmit();
      }
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const prompt = textarea.value.trim();
      if (!prompt) return;
      const url = `https://platform.agpt.co/copilot?autosubmit=true#prompt=${encodeURIComponent(prompt)}`;
      window.location.href = url;
    });
  </script>

  function logoMarkup(o) {
    const cls = o.size === "tall"  ? "logo logo--tall"
              : o.size === "short" ? "logo logo--short"
              : "logo";
    const src = "https://commons.wikimedia.org/wiki/Special:FilePath/"
              + encodeURIComponent(o.f) + "?width=480";
    return `<li class="${cls}" title="${o.n}">
              <img src="${src}" alt="${o.n}"
                   loading="lazy" decoding="async"
                   onerror="this.classList.add('is-failed')" />
              <span class="fallback">${o.fb}</span>
            </li>`;
  }

  function fillTrack(elId, items) {
    const html = items.map(logoMarkup).join("");
    document.getElementById(elId).innerHTML = html + html; // duplicate for seamless loop
  }
